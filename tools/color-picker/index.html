<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://toolwools.com/tools/color-picker/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#F4511E">
  <title>Color Picker & Converter — HEX, RGB, HSL | ToolWools</title>
  <meta name="description" content="Pick a color and convert between HEX, RGB, and HSL formats instantly. Free color tool for designers and developers.">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../tools.css">
  <style>.color-preview{width:100%;height:80px;border-radius:12px;border:1px solid var(--color-border);margin:16px 0}</style>
</head>
<body>
  <main class="tool-page">
    <div class="tool-container">
      <h1 class="tool-title">Color Picker & Converter</h1>
      <p class="tool-subtitle">Convert between HEX, RGB, and HSL color formats</p>
      <div class="tool-controls-row">
        <input type="color" id="picker" value="#F4511E" style="width:60px;height:40px;border:none;cursor:pointer">
        <input type="text" id="hex-input" class="tool-input" value="#F4511E" placeholder="#RRGGBB">
      </div>
      <div class="color-preview" id="preview" style="background:#F4511E"></div>
      <div class="stats-grid">
        <div class="stat-card"><span class="stat-label">HEX</span><span class="stat-value" id="out-hex">#F4511E</span></div>
        <div class="stat-card"><span class="stat-label">RGB</span><span class="stat-value" id="out-rgb">rgb(244, 81, 30)</span></div>
        <div class="stat-card"><span class="stat-label">HSL</span><span class="stat-value" id="out-hsl">hsl(14, 91%, 54%)</span></div>
      </div>
      <div class="tool-bottom-actions">
        <button id="btn-copy-hex" class="btn btn-secondary">Copy HEX</button>
        <button id="btn-copy-rgb" class="btn btn-secondary">Copy RGB</button>
        <button id="btn-copy-hsl" class="btn btn-secondary">Copy HSL</button>
      </div>
    </div>
  </main>
  <script src="../../script.js"></script>
  <script src="color-picker.js"></script>
</body>
</html>
