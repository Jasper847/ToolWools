<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://toolwools.com/tools/base64-encoder/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#F4511E">
  <title>Base64 Encoder/Decoder — Encode & Decode Text | ToolWools</title>
  <meta name="description" content="Encode text to Base64 or decode Base64 back to text instantly. Supports UTF-8. Free online tool.">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../tools.css">
</head>
<body>
  <main class="tool-page">
    <div class="tool-container">
      <h1 class="tool-title">Base64 Encoder / Decoder</h1>
      <p class="tool-subtitle">Encode and decode Base64 strings instantly</p>
      <textarea id="input" class="tool-textarea" rows="8" placeholder="Enter text or Base64 string..."></textarea>
      <div class="tool-bottom-actions">
        <button id="btn-encode" class="btn btn-primary">Encode →</button>
        <button id="btn-decode" class="btn btn-primary">← Decode</button>
        <button id="btn-copy" class="btn btn-secondary">Copy Result</button>
      </div>
      <textarea id="output" class="tool-textarea" rows="8" readonly placeholder="Result appears here..."></textarea>
    </div>
  </main>
  <script src="../../script.js"></script>
  <script src="base64.js"></script>
</body>
</html>
