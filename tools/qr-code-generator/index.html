<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://toolwools.com/tools/qr-code-generator/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#F4511E">
  <title>QR Code Generator — Create QR Codes Instantly | ToolWools</title>
  <meta name="description" content="Generate QR codes from any text or URL. Customize size, download as PNG. Free, no signup, works in your browser.">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../tools.css">
</head>
<body>
  <main class="tool-page">
    <div class="tool-container">
      <h1 class="tool-title">QR Code Generator</h1>
      <p class="tool-subtitle">Generate QR codes from text or URLs instantly</p>
      <textarea id="input" class="tool-textarea" rows="4" placeholder="Enter text or URL to encode...">https://toolwools.com</textarea>
      <div class="tool-controls-row">
        <label>Size: <input type="range" id="size" min="128" max="512" value="256" step="32"> <span id="size-val">256</span>px</label>
      </div>
      <div class="tool-bottom-actions">
        <button id="btn-generate" class="btn btn-primary">Generate QR Code</button>
        <button id="btn-download" class="btn btn-secondary">Download PNG</button>
      </div>
      <div id="qr-canvas-wrapper" style="display:flex;justify-content:center;margin-top:20px">
        <canvas id="qr-canvas"></canvas>
      </div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../../script.js"></script>
  <script src="qr-code.js"></script>
</body>
</html>
