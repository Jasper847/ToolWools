<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://toolwools.com/tools/url-encoder/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#F4511E">
  <title>URL Encoder/Decoder — Encode & Decode URLs | ToolWools</title>
  <meta name="description" content="Encode or decode URLs and query parameters instantly. Supports encodeURIComponent and full URI encoding. Free online tool.">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../tools.css">
</head>
<body>
  <main class="tool-page">
    <div class="tool-container">
      <h1 class="tool-title">URL Encoder / Decoder</h1>
      <p class="tool-subtitle">Encode and decode URL components</p>
      <textarea id="input" class="tool-textarea" rows="6" placeholder="Enter URL or text to encode/decode..."></textarea>
      <div class="tool-bottom-actions">
        <button id="btn-encode" class="btn btn-primary">Encode</button>
        <button id="btn-decode" class="btn btn-primary">Decode</button>
        <button id="btn-encode-full" class="btn btn-secondary">Encode Full URI</button>
        <button id="btn-copy" class="btn btn-secondary">Copy</button>
      </div>
      <textarea id="output" class="tool-textarea" rows="6" readonly placeholder="Result..."></textarea>
    </div>
  </main>
  <script src="../../script.js"></script>
  <script src="url-encoder.js"></script>
</body>
</html>
