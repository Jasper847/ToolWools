<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://toolwools.com/tools/og-preview/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#F4511E">
  <title>Open Graph Preview — Social Media Card Preview | ToolWools</title>
  <meta name="description" content="Preview how your Open Graph meta tags will appear on Facebook, Twitter, and LinkedIn. Instant visual preview, free.">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../tools.css">
  <style>
    .og-card{max-width:500px;border:1px solid var(--color-border);border-radius:12px;overflow:hidden;margin-top:16px;background:var(--color-surface)}
    .og-card img{width:100%;height:260px;object-fit:cover;background:#e5e7eb}
    .og-card-body{padding:12px 16px}
    .og-card-url{font-size:12px;color:var(--color-muted);text-transform:uppercase}
    .og-card-title{font-size:16px;font-weight:700;margin:4px 0}
    .og-card-desc{font-size:14px;color:var(--color-muted);line-height:1.4}
  </style>
</head>
<body>
  <main class="tool-page">
    <div class="tool-container">
      <h1 class="tool-title">Open Graph Preview</h1>
      <p class="tool-subtitle">Preview how your page will look when shared on social media</p>
      <div class="tool-controls-row" style="flex-direction:column;gap:10px">
        <input type="text" id="og-url" class="tool-input" placeholder="Page URL (e.g. https://example.com)" value="https://toolwools.com">
        <input type="text" id="og-title" class="tool-input" placeholder="og:title" value="ToolWools — Free Online Tools">
        <input type="text" id="og-desc" class="tool-input" placeholder="og:description" value="Free SEO, image, PDF, text and developer tools.">
        <input type="text" id="og-image" class="tool-input" placeholder="og:image URL" value="https://toolwools.com/og-image.png">
      </div>
      <div class="tool-bottom-actions"><button id="btn-preview" class="btn btn-primary">Update Preview</button></div>
      <div class="og-card" id="og-card">
        <img id="card-img" src="https://toolwools.com/og-image.png" alt="OG Preview">
        <div class="og-card-body">
          <div class="og-card-url" id="card-url">toolwools.com</div>
          <div class="og-card-title" id="card-title">ToolWools — Free Online Tools</div>
          <div class="og-card-desc" id="card-desc">Free SEO, image, PDF, text and developer tools.</div>
        </div>
      </div>
    </div>
  </main>
  <script src="../../script.js"></script>
  <script src="og-preview.js"></script>
</body>
</html>
